<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- uConnect: a "u" whose arm tips are two connected devices, before a
       darker C that echoes it across the diagonal. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2F5FCB"/>
      <stop offset="1" stop-color="#162F78"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#21479F"/>
      <stop offset="1" stop-color="#0D1F54"/>
    </linearGradient>
    <clipPath id="tile"><rect width="1024" height="1024" rx="228"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <polygon points="921.6,508.6 514.8,101.8 101.8,514.8 508.6,921.6 593.5,836.7 269.8,513.1 513.1,269.8 836.7,593.5" fill="url(#band)"/>
  </g>
  <path d="M 352 426.0 V 600 A 160.0 160.0 0 0 0 672 600 V 426.0"
        fill="none" stroke="#FFFFFF" stroke-width="112"/>
  <circle cx="352" cy="360" r="66.0" fill="none" stroke="#FFFFFF" stroke-width="52"/>
  <circle cx="672" cy="360" r="66.0" fill="none" stroke="#FFFFFF" stroke-width="52"/>
</svg>
