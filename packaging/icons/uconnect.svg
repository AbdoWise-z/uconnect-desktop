<svg xmlns="http://www.w3.org/2000/svg" viewBox="-51.2 -51.2 1126.4 1126.4">
  <!-- uConnect: a "u" whose arm tips are two connected devices, before a
       blue C that echoes it across the diagonal. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B9BFF"/>
      <stop offset="1" stop-color="#2F5FD8"/>
    </linearGradient>
    <clipPath id="tile"><rect width="1024" height="1024" rx="228"/></clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <polygon points="935.9,508.5 514.9,87.5 87.5,514.9 508.5,935.9 596.4,848.1 261.4,513.1 513.1,261.4 848.1,596.4" fill="url(#band)"/>
  </g>
  <g transform="translate(512 512) scale(0.9) translate(-512 -512)">
  <path d="M 352 426.0 V 600 A 160.0 160.0 0 0 0 672 600 V 426.0"
        fill="none" stroke="#111111" stroke-width="112"/>
  <circle cx="352" cy="360" r="66.0" fill="none" stroke="#111111" stroke-width="52"/>
  <circle cx="672" cy="360" r="66.0" fill="none" stroke="#111111" stroke-width="52"/>
  </g>
</svg>
